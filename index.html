<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131315">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Sổ thu chi cá nhân CapMoney, lưu trên thiết bị và sử dụng ngoại tuyến.">
  <title>CapMoney · Sổ thu chi</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pro.css">
  <link rel="stylesheet" href="ui.css">
  <script src="finance.js" defer></script>
  <script src="media.js" defer></script>
  <script src="app.js" defer></script>
  <script src="profile.js" defer></script>
  <script src="location.js" defer></script>
  <script src="pro.js" defer></script>
  <script src="sharing.js" defer></script>
  <script src="backup-schedule.js" defer></script>
  <script src="scheduled-backup.js" defer></script>
  <script src="pwa.js" defer></script>
</head>
<body>
  <div class="app">
    <header><div><small id="greeting">Sổ thu chi của bạn</small><h1 id="username">Nos</h1></div><button class="avatar" data-page="profile" aria-label="Mở hồ sơ">N</button></header>
    <div id="notice" role="status" hidden></div>
    <main id="screen"></main>
    <button id="add" class="fab" data-action="transaction" aria-label="Thêm giao dịch">+</button>
    <nav aria-label="Điều hướng chính" id="nav"></nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button data-action="close" aria-label="Đóng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><form id="form"></form></dialog>
  <div id="toast" role="status"></div>
  <noscript>Hãy bật JavaScript để sử dụng sổ thu chi.</noscript>
</body>
</html>
